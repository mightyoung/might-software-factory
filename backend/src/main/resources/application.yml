spring:
  application:
    name: might-software-factory
  datasource:
    url: ${LAN_PG_JDBC_URL}
    username: ${LAN_PG_USERNAME}
    password: ${LAN_PG_PASSWORD}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
  session:
    store-type: jdbc
    jdbc:
      initialize-schema: never
  jooq:
    sql-dialect: POSTGRES

flowable:
  database-schema-update: false
  async-executor-activate: false
  async-history-executor-activate: false
