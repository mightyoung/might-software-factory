spring:
  application:
    name: might-software-factory
  aop:
    # Repository exception translation uses interface proxies; repository implementations are final.
    proxy-target-class: false
  datasource:
    url: ${LAN_PG_APP_JDBC_URL}
    username: ${LAN_PG_APP_USERNAME}
    password: ${LAN_PG_APP_PASSWORD}
    driver-class-name: org.postgresql.Driver
  flyway:
    # Runtime must never run DDL. Apply versioned migrations separately with the migration identity.
    enabled: false
    table: flyway_schema_history_app
  session:
    store-type: jdbc
    timeout: 30m
    jdbc:
      initialize-schema: never
  jooq:
    sql-dialect: POSTGRES
  modulith:
    events:
      jdbc:
        # V5 owns the five-column publication schema; Modulith 2.1 defaults to its V2 structure.
        use-legacy-structure: true
        schema-initialization:
          # The event publication registry is created by the versioned Flyway migration.
          enabled: false

software-factory:
  workflow:
    finding-review:
      initiation-enabled: false
      tenant-pins: {}
  security:
    session:
      # Authentication age never slides with access; the separate idle timeout remains 30m.
      absolute-timeout: 12h
    login-throttle:
      # Process-local limits: successes and malformed bodies consume attempt capacity too.
      global-attempts: 600
      source-attempts: 60
      attempt-window: 60s
      failure-threshold: 5
      failure-window: 5m
      cooldown: 30s
      max-concurrent: 8
      max-sources: 4096
      max-pairs: 8192

server:
  # Unverified Forwarded/X-Forwarded-For headers cannot change login budget identity.
  forward-headers-strategy: none

flowable:
  # Process resources require explicit reviewed deployment; startup must not deploy them.
  check-process-definitions: false
  database-schema-update: false
  async-executor-activate: false
  async-history-executor-activate: false
