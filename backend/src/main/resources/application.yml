spring:
  application:
    name: might-software-factory
  aop:
    # Repository exception translation uses interface proxies; repository implementations are final.
    proxy-target-class: false
  datasource:
    url: ${LAN_PG_APP_JDBC_URL}
    username: ${LAN_PG_APP_USERNAME}
    password: ${LAN_PG_APP_PASSWORD}
    driver-class-name: org.postgresql.Driver
  flyway:
    # Runtime must never run DDL. Apply versioned migrations separately with the migration identity.
    enabled: false
    table: flyway_schema_history_app
  session:
    store-type: jdbc
    timeout: 30m
    jdbc:
      initialize-schema: never
  jooq:
    sql-dialect: POSTGRES
  modulith:
    events:
      jdbc:
        schema-initialization:
          # The event publication registry is created by the versioned Flyway migration.
          enabled: false

software-factory:
  security:
    session:
      # Authentication age never slides with access; the separate idle timeout remains 30m.
      absolute-timeout: 12h

flowable:
  database-schema-update: false
  async-executor-activate: false
  async-history-executor-activate: false
