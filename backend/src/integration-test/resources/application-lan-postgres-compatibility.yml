spring:
  datasource:
    hikari:
      # Keep startup and preflight connection inspection independent of the pool under test.
      maximum-pool-size: 2
      minimum-idle: 1
  flyway:
    # No DDL during Spring context startup. Provision approved test schemas separately.
    enabled: false
  sql:
    init:
      mode: never
  modulith:
    events:
      jdbc:
        schema-initialization:
          enabled: false
  session:
    store-type: jdbc
    jdbc:
      initialize-schema: never

flowable:
  database-schema-update: false
  async-executor-activate: false
  async-history-executor-activate: false
