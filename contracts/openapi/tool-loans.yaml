                $ref: '#/components/schemas/Error'
        '401':
          description: Authentication or current session authority required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Application or action denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Application not visible to current applicant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Version, definition, idempotency, state or command conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Authority or dependency unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/tooling/loan-applications/visibility/{visibility}/{id}:
    parameters:
    - *id001
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      operationId: getScopedToolLoanApplication
      description: Read-only detail using the same department or current custody predicate
        as the scoped list. Unauthorized or cross-tenant IDs return 404. Does not authorize
        any business command.
      responses:
        '200':
          description: Success. Cache-Control is no-store.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoanResponse'
        '400':
          description: Invalid input, unknown or protected field
          content:
