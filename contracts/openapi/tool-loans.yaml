  /api/v1/tooling/loan-applications/{id}/receive:
    parameters:
    - name: id
      in: path
      required: true
      schema: &id005
        type: string
        format: uuid
    post:
      operationId: receiveReturnedTools
      description: Current eligible custody keeper selects pending return items for NORMAL or DAMAGED
        receipt. Requires tool_loan.receive and forbids self handling. DAMAGED requires a nonblank reason
        and records tool DAMAGED. Atomically release only selected occupancy, append per-item receipt
        and history, and increment loan version. State becomes SETTLED only when every issued item is
        received. A failure rolls back all selected receipts. Unknown outcomes retain the original request
        key and payload.
      responses:
        '200':
          description: Success. Cache-Control is no-store.
          content:
            application/json:
              schema:
