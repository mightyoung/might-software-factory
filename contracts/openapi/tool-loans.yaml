openapi: 3.1.0
info:
  title: Tool loan applications
  version: 1.1.0
  description: Applicant-owned multi-item loan applications and keeper-authorized atomic whole-order issuance.
    Application submission does not occupy tools. Issuance requires tool_loan.issue, current keeper qualification
    and non-self handling. Every command rechecks current authorization and supports exact idempotent
    replay.
security:
- sessionCookie: []
paths:
  /api/v1/tooling/loan-applications:
    get:
      operationId: listOwnToolLoanApplications
      description: Returns at most 100 own applications, newest first with id as tie breaker.
      responses:
        '200':
          description: Success. Cache-Control is no-store.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListResponse'
        '400':
          description: Invalid input, unknown or protected field
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Authentication or current session authority required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Application or action denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Application not visible to current applicant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Version, definition, idempotency, state or command conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Authority or dependency unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      operationId: createToolLoanApplication
      description: Submit a multi-item application. No tool occupancy is created. organizationId must
        be a current applicant department, and every tool must belong to the authorized custody scope.
        The result has version 1.
      responses:
        '200':
          description: Success. Cache-Control is no-store.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoanResponse'
        '400':
          description: Invalid input, unknown or protected field
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Authentication or current session authority required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Application or action denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Application not visible to current applicant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Version, definition, idempotency, state or command conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Authority or dependency unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRequest'
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema: &id001
          type: string
          format: uuid
      - name: X-XSRF-TOKEN
        in: header
        required: true
        schema: &id002
          type: string
        description: Current CSRF token from the authenticated session.
  /api/v1/tooling/loan-applications/candidates:
    get:
      operationId: toolLoanCandidates
      description: Returns current applicant departments and authorized custody scopes. At most 200 NORMAL
        tools from the selected visible scope are returned in code/id order. Without a selected visible
        scope, tools is empty. loanId binds revision candidates to an owned application and requires update
        authorization.
      responses:
        '200':
          description: Success. Cache-Control is no-store.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CandidatesResponse'
        '400':
          description: Invalid input, unknown or protected field
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Authentication or current session authority required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Application or action denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Application not visible to current applicant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Version, definition, idempotency, state or command conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Authority or dependency unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: custodyScopeId
        in: query
        required: false
        schema: *id001
      - name: loanId
        in: query
        required: false
        schema: *id001
  /api/v1/tooling/loan-applications/{id}:
    parameters:
    - name: id
      in: path
      required: true
      schema: *id001
    get:
      operationId: readOwnToolLoanApplication
      description: Returns the current revision of an application owned by the authenticated applicant.
      responses:
        '200':
          description: Success. Cache-Control is no-store.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoanResponse'
        '400':
          description: Invalid input, unknown or protected field
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Authentication or current session authority required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Application or action denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Application not visible to current applicant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Version, definition, idempotency, state or command conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Authority or dependency unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/tooling/loan-applications/{id}/revise:
    parameters:
    - name: id
      in: path
      required: true
      schema: *id001
    post:
      operationId: reviseToolLoanApplication
      description: Append a full replacement revision while PENDING_ISSUE. The original department, custody
        scope and definition version stay fixed. Request replay returns the original successful revision
        after current authorization is checked.
      responses:
        '200':
          description: Success. Cache-Control is no-store.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoanResponse'
        '400':
          description: Invalid input, unknown or protected field
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Authentication or current session authority required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Application or action denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Application not visible to current applicant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Version, definition, idempotency, state or command conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Authority or dependency unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviseRequest'
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema: *id001
      - name: X-XSRF-TOKEN
        in: header
        required: true
        schema: *id002
        description: Current CSRF token from the authenticated session.
  /api/v1/tooling/loan-applications/{id}/cancel:
    parameters:
    - name: id
      in: path
      required: true
      schema: *id001
    post:
      operationId: cancelToolLoanApplication
      description: Withdraw a PENDING_ISSUE application and append its final revision. Only definitionVersion
        and expectedVersion are accepted. Request replay returns the original successful revision after
        current authorization is checked.
      responses:
        '200':
          description: Success. Cache-Control is no-store.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoanResponse'
        '400':
          description: Invalid input, unknown or protected field
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Authentication or current session authority required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Application or action denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Application not visible to current applicant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Version, definition, idempotency, state or command conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Authority or dependency unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelRequest'
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema: *id001
      - name: X-XSRF-TOKEN
        in: header
        required: true
        schema: *id002
        description: Current CSRF token from the authenticated session.
  /api/v1/tooling/loan-applications/issue-queue:
    get:
      operationId: listKeeperPendingToolLoans
      description: Returns at most 100 PENDING_ISSUE applications in the current eligible keeper custody
        scopes, excluding the keeper’s own applications. Requires tool_loan.issue. This list does not
        reserve or occupy any tool.
      responses:
        '200':
          description: Success. Cache-Control is no-store.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListResponse'
        '400':
          description: Invalid input, unknown or protected field
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Authentication or current session authority required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Application or action denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Requested application is not visible under current keeper qualification.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Version, definition, idempotency, state or command conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Authority or dependency unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/tooling/loan-applications/{id}/issue-detail:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      operationId: getKeeperToolLoanDetail
      description: Current application detail for an eligible keeper with tool_loan.issue. Applicant ownership
        does not grant keeper handling access and self handling is denied. Includes ordered tool labels
        for whole-order confirmation.
      responses:
        '200':
          description: Success. Cache-Control is no-store.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoanResponse'
        '400':
          description: Invalid input, unknown or protected field
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Authentication or current session authority required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Application or action denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Application is not visible under current keeper qualification.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Version, definition, idempotency, state or command conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Authority or dependency unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/tooling/loan-applications/{id}/issue:
    parameters:
    - name: id
      in: path
      required: true
      schema: &id003
        type: string
        format: uuid
    post:
      operationId: issueToolLoanApplication
      description: Atomically issue all current application detail items. Requires tool_loan.issue and
        current effective custody keeper qualification, and forbids handling one’s own application. definitionVersion
        and expectedVersion must match the current PENDING_ISSUE application. Revalidate every item and
        create all occupancy records in the same transaction with the new ISSUED version, history, success
        audit and command receipt. Any unavailable item rejects the entire command with no partial occupancy.
        Same-key same-input replay returns the original successful result after current authorization
        recheck. Unknown results must retain the original key and payload.
      responses:
        '200':
          description: Success. Cache-Control is no-store.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoanResponse'
        '400':
          description: Invalid input, unknown or protected field
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Authentication or current session authority required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Application or action denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Application is not visible under current keeper qualification.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Version, definition, idempotency, state or command conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Authority or dependency unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueRequest'
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema: *id003
      - name: X-XSRF-TOKEN
        in: header
        required: true
        schema:
          type: string
        description: Current CSRF token from the authenticated session.
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: SESSION
  schemas:
    LoanRecord:
      type: object
      additionalProperties: false
      required:
      - id
      - version
      - state
      - definitionVersion
      - organizationId
      - custodyScopeId
      - purpose
      - toolIds
      - createdAt
      - updatedAt
      - tools
      properties:
        id: *id001
        version: &id007
          type: integer
          format: int64
          minimum: 1
          maximum: 9223372036854775806
        state:
          type: string
          enum:
          - PENDING_ISSUE
          - WITHDRAWN
          - ISSUED
        definitionVersion:
          type: string
          const: '1'
        organizationId: *id001
        custodyScopeId: *id001
        purpose:
          type: string
          minLength: 1
          maxLength: 4000
        toolIds:
          type: array
          items: *id001
          minItems: 1
          maxItems: 100
          uniqueItems: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        tools:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/Option'
        awaitingOtherCustodian:
          type: boolean
          description: Optional own PENDING_ISSUE detail signal. True when the current custody scope has
            no other effective keeper eligible to issue this application. Current authorization and the
            self-handling restriction still apply to every command.
    CreateRequest:
      type: object
      additionalProperties: false
      required:
      - definitionVersion
      - organizationId
      - custodyScopeId
      - purpose
      - toolIds
      properties:
        definitionVersion: &id004
          type: string
          const: '1'
        organizationId: *id001
        custodyScopeId: *id001
        purpose: &id005
          type: string
          minLength: 1
          maxLength: 4000
        toolIds: &id006
          type: array
          items: *id001
          minItems: 1
          maxItems: 100
          uniqueItems: true
    ReviseRequest:
      type: object
      additionalProperties: false
      required:
      - definitionVersion
      - organizationId
      - custodyScopeId
      - purpose
      - toolIds
      - expectedVersion
      properties:
        definitionVersion: *id004
        organizationId: *id001
        custodyScopeId: *id001
        purpose: *id005
        toolIds: *id006
        expectedVersion: *id007
    CancelRequest:
      type: object
      additionalProperties: false
      required:
      - definitionVersion
      - expectedVersion
      properties:
        definitionVersion:
          type: string
          const: '1'
        expectedVersion: *id007
    Option:
      type: object
      additionalProperties: false
      required:
      - id
      - label
      properties:
        id: *id001
        label: *id002
    CustodyScope:
      type: object
      additionalProperties: false
      required:
      - id
      - label
      - organizationId
      properties:
        id: *id001
        label: *id002
        organizationId: *id001
    Candidates:
      type: object
      additionalProperties: false
      required:
      - departments
      - scopes
      - tools
      properties:
        departments:
          type: array
          items:
            $ref: '#/components/schemas/Option'
        scopes:
          type: array
          items:
            $ref: '#/components/schemas/CustodyScope'
        tools:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/Option'
    Meta:
      type: object
      additionalProperties: false
      required:
      - traceId
      properties:
        traceId: *id002
    LoanResponse:
      type: object
      additionalProperties: false
      required:
      - data
      - meta
      properties:
        data:
          $ref: '#/components/schemas/LoanRecord'
        meta:
          $ref: '#/components/schemas/Meta'
    ListResponse:
      type: object
      additionalProperties: false
      required:
      - data
      - meta
      properties:
        data:
          type: object
          additionalProperties: false
          required:
          - records
          properties:
            records:
              type: array
              maxItems: 100
              items:
                $ref: '#/components/schemas/ListRecord'
        meta:
          $ref: '#/components/schemas/Meta'
    CandidatesResponse:
      type: object
      additionalProperties: false
      required:
      - data
      - meta
      properties:
        data:
          $ref: '#/components/schemas/Candidates'
        meta:
          $ref: '#/components/schemas/Meta'
    Error:
      type: object
      additionalProperties: false
      required:
      - code
      - message
      - traceId
      - retryable
      properties:
        code: *id002
        message: *id002
        traceId: *id002
        retryable:
          type: boolean
        fieldErrors:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - field
            - reason
            properties:
              field: *id002
              reason: *id002
        currentVersion:
          type: integer
          format: int64
    ListRecord:
      type: object
      additionalProperties: false
      required:
      - id
      - version
      - state
      - definitionVersion
      - organizationId
      - custodyScopeId
      - purpose
      - toolIds
      - createdAt
      - updatedAt
      properties:
        id: &id008
          type: string
          format: uuid
        version:
          type: integer
          format: int64
          minimum: 1
          maximum: 9223372036854775806
        state:
          type: string
          enum:
          - PENDING_ISSUE
          - WITHDRAWN
          - ISSUED
        definitionVersion:
          type: string
          const: '1'
        organizationId: *id008
        custodyScopeId: *id008
        purpose:
          type: string
          minLength: 1
          maxLength: 4000
        toolIds:
          type: array
          items: *id008
          minItems: 1
          maxItems: 100
          uniqueItems: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    IssueRequest:
      type: object
      additionalProperties: false
      required:
      - definitionVersion
      - expectedVersion
      properties:
        definitionVersion:
          type: string
          const: '1'
        expectedVersion:
          type: integer
          format: int64
          minimum: 1
          maximum: 9223372036854775806
