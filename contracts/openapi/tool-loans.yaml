openapi: 3.1.0
info:
  title: Tool loan applications
  version: 1.2.0
  description: Applicant-owned multi-item loan applications, atomic whole-order issuance, borrower partial
    return requests, and keeper normal or damaged receipt. Return requests retain occupancy. Receipt releases
    only the selected requested items. Current authorization, no self handling, expected version and exact
    idempotency apply to each command.
security:
- sessionCookie: []
paths:
  /api/v1/tooling/loan-applications:
    get:
      operationId: listOwnToolLoanApplications
      description: Returns at most 100 own applications, newest first with id as tie breaker.
      responses:
        '200':
          description: Success. Cache-Control is no-store.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListResponse'
        '400':
          description: Invalid input, unknown or protected field
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Authentication or current session authority required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Application or action denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Application not visible to current applicant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Version, definition, idempotency, state or command conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Authority or dependency unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      operationId: createToolLoanApplication
      description: Submit a multi-item application. No tool occupancy is created. organizationId must
        be a current applicant department, and every tool must belong to the authorized custody scope.
        The result has version 1.
      responses:
        '200':
          description: Success. Cache-Control is no-store.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoanResponse'
        '400':
          description: Invalid input, unknown or protected field
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Authentication or current session authority required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Application or action denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Application not visible to current applicant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Version, definition, idempotency, state or command conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Authority or dependency unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRequest'
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema: &id001
          type: string
          format: uuid
      - name: X-XSRF-TOKEN
        in: header
        required: true
        schema: &id002
          type: string
        description: Current CSRF token from the authenticated session.
  /api/v1/tooling/loan-applications/candidates:
    get:
      operationId: toolLoanCandidates
      description: Returns current applicant departments and authorized custody scopes. At most 200 NORMAL
        tools from the selected visible scope are returned in code/id order. Without a selected visible
        scope, tools is empty. loanId binds revision candidates to an owned application and requires update
        authorization.
