              schema:
                $ref: '#/components/schemas/Error'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: SESSION
  schemas:
    LoanRecord:
      type: object
      additionalProperties: false
      required:
      - id
      - version
      - state
      - definitionVersion
      - organizationId
      - custodyScopeId
      - purpose
      - toolIds
      - createdAt
      - updatedAt
      - tools
      properties:
        id: *id001
        version: &id009
          type: integer
          format: int64
          minimum: 1
          maximum: 9223372036854775806
        state:
          type: string
          enum:
          - PENDING_ISSUE
          - WITHDRAWN
          - ISSUED
          - SETTLED
        definitionVersion:
          type: string
          minLength: 1
          maxLength: 64
          pattern: .*\S.*
          description: Nonblank historical definition version bound to this loan. Return and receipt use
            the stored version without rebinding the loan to the current creation definition.
        organizationId: *id001
        custodyScopeId: *id001
        purpose:
          type: string
          minLength: 1
          maxLength: 4000
        toolIds:
          type: array
          items: *id001
          minItems: 1
          maxItems: 100
          uniqueItems: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        tools:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/Option'
        awaitingOtherCustodian:
          type: boolean
          description: Optional own pending/issued detail signal. True when no other currently eligible
            keeper can issue or receive this loan. No self handling remains enforced for commands.
        returnItems:
          type: array
          minItems: 0
          maxItems: 100
          items:
            $ref: '#/components/schemas/ReturnItem'
          description: Ordered per-tool return progress in issued or settled detail and command responses.
            Missing optional item fields are omitted. Counts distinguish still occupied, awaiting receipt
            and received items. Old issued records are projected as outstanding until a return request
            or receipt exists.
    CreateRequest:
      type: object
      additionalProperties: false
      required:
      - definitionVersion
      - organizationId
      - custodyScopeId
      - purpose
      - toolIds
      properties:
        definitionVersion: &id006
          type: string
          const: '1'
        organizationId: *id001
        custodyScopeId: *id001
        purpose: &id007
          type: string
          minLength: 1
          maxLength: 4000
        toolIds: &id008
          type: array
          items: *id001
          minItems: 1
          maxItems: 100
          uniqueItems: true
    ReviseRequest:
      type: object
      additionalProperties: false
      required:
      - definitionVersion
      - organizationId
      - custodyScopeId
      - purpose
      - toolIds
      - expectedVersion
      properties:
        definitionVersion: *id006
        organizationId: *id001
        custodyScopeId: *id001
        purpose: *id007
        toolIds: *id008
        expectedVersion: *id009
    CancelRequest:
      type: object
      additionalProperties: false
      required:
      - definitionVersion
      - expectedVersion
      properties:
        definitionVersion:
          type: string
          const: '1'
        expectedVersion: *id009
    Option:
      type: object
      additionalProperties: false
      required:
      - id
      - label
      properties:
        id: *id001
        label: *id002
    CustodyScope:
      type: object
      additionalProperties: false
      required:
      - id
      - label
      - organizationId
      properties:
        id: *id001
        label: *id002
        organizationId: *id001
    Candidates:
      type: object
      additionalProperties: false
      required:
      - departments
      - scopes
      - tools
      properties:
        departments:
          type: array
          items:
            $ref: '#/components/schemas/Option'
        scopes:
          type: array
          items:
            $ref: '#/components/schemas/CustodyScope'
        tools:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/Option'
    Meta:
      type: object
      additionalProperties: false
      required:
      - traceId
      properties:
        traceId: *id002
    LoanResponse:
      type: object
      additionalProperties: false
      required:
      - data
      - meta
      properties:
        data:
          $ref: '#/components/schemas/LoanRecord'
        meta:
          $ref: '#/components/schemas/Meta'
    ListResponse:
      type: object
      additionalProperties: false
      required:
      - data
      - meta
      properties:
        data:
          type: object
          additionalProperties: false
          required:
          - records
          properties:
            records:
              type: array
              maxItems: 100
              items:
                $ref: '#/components/schemas/ListRecord'
        meta:
          $ref: '#/components/schemas/Meta'
    CandidatesResponse:
      type: object
      additionalProperties: false
      required:
      - data
      - meta
      properties:
        data:
          $ref: '#/components/schemas/Candidates'
        meta:
          $ref: '#/components/schemas/Meta'
    Error:
      type: object
      additionalProperties: false
      required:
      - code
      - message
      - traceId
      - retryable
      properties:
        code: *id002
        message: *id002
        traceId: *id002
        retryable:
          type: boolean
        fieldErrors:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - field
            - reason
            properties:
              field: *id002
              reason: *id002
        currentVersion:
          type: integer
          format: int64
    ListRecord:
      type: object
      additionalProperties: false
      required:
      - id
      - version
      - state
      - definitionVersion
      - organizationId
      - custodyScopeId
      - purpose
      - toolIds
      - createdAt
      - updatedAt
      properties:
        id: &id010
          type: string
          format: uuid
        version:
          type: integer
          format: int64
          minimum: 1
          maximum: 9223372036854775806
        state:
          type: string
          enum:
          - PENDING_ISSUE
          - WITHDRAWN
          - ISSUED
          - SETTLED
        definitionVersion:
          type: string
          minLength: 1
          maxLength: 64
          pattern: .*\S.*
          description: Nonblank historical definition version bound to this loan. Return and receipt use
            the stored version without rebinding the loan to the current creation definition.
        organizationId: *id010
        custodyScopeId: *id010
        purpose:
          type: string
          minLength: 1
          maxLength: 4000
        toolIds:
          type: array
          items: *id010
          minItems: 1
          maxItems: 100
          uniqueItems: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    IssueRequest:
      type: object
      additionalProperties: false
      required:
      - definitionVersion
      - expectedVersion
      properties:
        definitionVersion:
          type: string
          const: '1'
        expectedVersion:
          type: integer
          format: int64
          minimum: 1
          maximum: 9223372036854775806
    ReturnItem:
      type: object
      additionalProperties: false
      required:
      - toolId
      - label
      - state
      properties:
        toolId:
          type: string
          format: uuid
        label:
          type: string
        state:
          type: string
          enum:
          - OUTSTANDING
          - REQUESTED
          - RECEIVED
          - LOST
        requestId:
          type: string
          format: uuid
        condition:
          type: string
          enum:
          - NORMAL
          - DAMAGED
        reason:
          type: string
          maxLength: 4000
    CloseLostInput:
      type: object
      additionalProperties: false
      required:
      - definitionVersion
      - expectedVersion
      - toolId
      - reason
      properties:
        definitionVersion:
          type: string
          minLength: 1
          maxLength: 64
          pattern: .*\S.*
          description: Nonblank historical definition version bound to this loan. Return and receipt use
            the stored version without rebinding the loan to the current creation definition.
        expectedVersion:
          type: integer
          format: int64
          minimum: 1
          maximum: 9223372036854775806
        toolId:
          type: string
          format: uuid
        reason:
          type: string
          minLength: 1
          maxLength: 4000
          pattern: .*\S.*
    ReturnRequestInput:
      type: object
      additionalProperties: false
      required:
      - definitionVersion
      - expectedVersion
      - toolIds
      properties:
        definitionVersion:
          type: string
          minLength: 1
          maxLength: 64
          pattern: .*\S.*
          description: Nonblank historical definition version bound to this loan. Return and receipt use
            the stored version without rebinding the loan to the current creation definition.
        expectedVersion:
          type: integer
          format: int64
          minimum: 1
          maximum: 9223372036854775806
        toolIds:
          type: array
          items:
            type: string
            format: uuid
          minItems: 1
          maxItems: 100
          uniqueItems: true
    ReceiveItem:
      type: object
      additionalProperties: false
      required:
      - toolId
      - condition
      properties:
        toolId:
          type: string
          format: uuid
        condition:
          type: string
          enum:
          - NORMAL
          - DAMAGED
        reason:
          type: string
          maxLength: 4000
      allOf:
      - if:
          properties:
            condition:
              const: DAMAGED
        then:
          required:
          - reason
          properties:
            reason:
              type: string
              minLength: 1
              maxLength: 4000
    ReceiveInput:
      type: object
      additionalProperties: false
      required:
      - definitionVersion
      - expectedVersion
      - items
      properties:
        definitionVersion:
          type: string
          minLength: 1
          maxLength: 64
          pattern: .*\S.*
          description: Nonblank historical definition version bound to this loan. Return and receipt use
            the stored version without rebinding the loan to the current creation definition.
        expectedVersion:
          type: integer
          format: int64
          minimum: 1
          maximum: 9223372036854775806
        items:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/ReceiveItem'
          description: Unique toolId per command. The server resolves the unique current pending request
            for each selected tool.
