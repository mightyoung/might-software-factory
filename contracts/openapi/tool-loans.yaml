          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Authority or dependency unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: custodyScopeId
        in: query
        required: false
        schema: *id001
      - name: loanId
        in: query
        required: false
        schema: *id001
