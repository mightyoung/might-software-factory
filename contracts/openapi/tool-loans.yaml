  /api/v1/tooling/loan-applications/visibility/{visibility}:
    parameters:
    - &id001
      name: visibility
      in: path
      required: true
      schema:
        type: string
        enum:
        - department
        - custody
    get:
      operationId: listScopedToolLoanApplications
      description: Returns at most 100 authorized applications, newest first. Department
        mode requires tool_loan_department.read and matches the original application
        organization. Custody mode requires tool_loan_custody.read plus a current effective
        custodianship in the original scope. Ordinary borrower read permission does
        not grant either mode.
      responses:
        '200':
          description: Success. Cache-Control is no-store.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListResponse'
        '400':
          description: Invalid input, unknown or protected field
          content:
            application/json:
