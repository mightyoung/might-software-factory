openapi: 3.1.0
info:
  title: Asset and hazard foundation — finite G014 contract
  version: 1.0.0
  description: 'Source contract only.67 literal operations,17 fixed selectors,29 registered action triples (6 READ,23
    mutations). No implemented HTTP/backend/browser acceptance is claimed. Business projections are not the19 persistence
    tables. Hazard existence UNKNOWN/PRESENT/NOT_PRESENT is an observation, never risk grade; equipment type is
    free descriptive text, not classification. No factor provider exists: factor inputs are forbidden and projected
    factor values are null.'
x-implementation-status: contract-only
x-contract-freeze:
  revision: G014R3
  manifestSha256: 72189ee4cb809c9527ee4db85479783e14fe9ec9f251817ab15ce000ff0ba667
x-history-label-addendum:
  status: Root-accepted source-contract amendment after original R3 freeze; implementation and runtime verification
    pending
  source: msf-g014-history-label-anchor-architecture-20261104.md
  decision: DB-derived business-version-at-bind anchors; exact typed root-revision joins, never current-label or
    timestamp-as-of lookup
  line_workshop:
  - lineAtBind
  - workshopAtBind
  stage_equipment:
  - stageAtBind
  - equipmentAtBind
  identity: snapshot.id equals existing endpoint ID; END retains original BIND version/code/name
  authority: parent READ authorizes minimal retained labels; current endpoint detail independently requires endpoint
    READ
  ddlBoundary: 19 tables unchanged; four deferred root-revision FKs make final-seal flush40 instead of original36;
    DDL owned separately
