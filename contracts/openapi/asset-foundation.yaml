components:
  securitySchemes:
    sessionCookieAuth:
      type: apiKey
      in: cookie
      name: SESSION
  parameters:
    CsrfToken:
      in: header
      name: X-XSRF-TOKEN
      required: true
      schema:
        type: string
        minLength: 1
      description: Current session CSRF token, mandatory for commands and all POST queries.
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      schema:
        $ref: '#/components/schemas/CanonicalUuid'
      description: Exactly one canonical lowercase UUID; no duplicate/comma-list headers. Namespace server tenant/actor/fixed
        action/key. Preserve same body/key after unknown outcome.
  headers:
    SemanticETag:
      description: Weak context- and use-bound semantic SHA-256 validator, excluding random envelope metadata.
      schema:
        type: string
        pattern: ^W/"[0-9a-f]{64}"$
    PrivateRevalidation:
      schema:
        type: string
        const: private, no-cache
    SessionVary:
      schema:
        type: string
        const: Cookie
  responses:
    Error400:
      description: Malformed or invalid request; safe bounded field errors only.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Error401:
      description: No current authenticated session.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Error403:
      description: Current app/action/scope unavailable; no cached authority fallback.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Error404:
      description: Absent or out-of-scope target, indistinguishable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Error409:
      description: Version, idempotency, lifecycle or interval overlap conflict; no automatic retry.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Error413:
      description: Raw body exceeds route bound.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Error415:
      description: Unsupported media or charset; application/json with optional UTF-8 only.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Error503:
      description: Dependency unavailable or transaction outcome UNKNOWN. An actual command outcome UNKNOWN uses
        COMMAND_OUTCOME_UNKNOWN with retryable=false; do not automatically resend. Preserve the original key/body
        for explicit reconciliation and never infer rollback from an absent receipt or fabricate success/failure.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    CanonicalUuid:
      type: string
      format: uuid
      pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
      minLength: 36
      maxLength: 36
      description: Canonical lowercase UUID only; no coercion, trimming or alternate spelling.
    Version:
      type: integer
      minimum: 1
      maximum: 9007199254740991
      description: JSON integer token only; reject strings, decimal and exponent notation. Increment exhaustion
        fails without writing.
      x-json-integer-token-only: true
    Code:
      type: string
      minLength: 1
      maxLength: 64
      pattern: ^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$(?![\s\S])
      description: Immutable, case-sensitive ASCII code. Preserve accepted spelling.
    Name:
      type: string
      minLength: 1
      maxLength: 200
      pattern: ^(?![\u0009-\u000D\u0020\u0085\u00A0\u1680\u2000-\u200A\u2028\u2029\u202F\u205F\u3000])(?!.*[\u0009-\u000D\u0020\u0085\u00A0\u1680\u2000-\u200A\u2028\u2029\u202F\u205F\u3000]$)[^\u0000-\u001F\u007F-\u009F]+$
      description: 1..200 Unicode code points, no outer Unicode White_Space or control code points; preserve Unicode
        exactly.
      x-length-unit: UNICODE_CODE_POINTS
    Description:
      type: string
      minLength: 1
      maxLength: 2000
      pattern: ^[^\u0000-\u0008\u000B\u000C\u000E-\u001F]*$
      x-length-unit: UNICODE_CODE_POINTS
      description: No NUL or C0 control except tab/LF/CR; preserve Unicode, whitespace and normalization exactly.
    HazardDescription:
      type: string
      minLength: 1
      maxLength: 20000
      pattern: ^[^\u0000-\u0008\u000B\u000C\u000E-\u001F]*$
      x-length-unit: UNICODE_CODE_POINTS
      description: No NUL or C0 control except tab/LF/CR; preserve Unicode, whitespace and normalization exactly.
    MicrosecondInstant:
      type: string
      format: date-time
      pattern: ^(?!0000)[0-9]{4}-(0[1-9]|1[0-2])-(0[1-9]|[12][0-9]|3[01])T([01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9](\.[0-9]{1,6})?(Z|[+-]([01][0-9]|2[0-3]):[0-5][0-9])$(?![\s\S])
      description: Valid RFC3339 calendar instant with explicit offset, year0001..9999 and at most six fractional
        digits; reject invalid date, leap second or precision truncation. Normalize to UTC microseconds; normalized
        year must remain0001..9999.
    Lifecycle:
      type: string
      enum:
      - ACTIVE
      - ARCHIVED
    OperationalState:
      type: string
      enum:
      - UNKNOWN
      - IN_SERVICE
      - OUT_OF_SERVICE
    ExistenceState:
      type: string
      enum:
      - UNKNOWN
      - PRESENT
      - NOT_PRESENT
    Duty:
      type: string
      enum:
      - OPERATIONS
      - MAINTENANCE
      - SAFETY_COORDINATION
      description: Product responsibility labels only; no statutory qualification or professional certification.
    Metadata:
      type: object
      additionalProperties: false
      required:
      - requestId
      - traceId
      - schemaVersion
      properties:
        requestId:
          type: string
        traceId:
          type: string
        schemaVersion:
          type: string
          const: '1'
    ErrorResponse:
      type: object
      additionalProperties: false
      required:
      - code
      - message
      - traceId
      - retryable
      - fieldErrors
      properties:
        code:
          type: string
        message:
          type: string
        traceId:
          type: string
        retryable:
          type: boolean
        fieldErrors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
        currentVersion:
          $ref: '#/components/schemas/Version'
    FieldError:
      type: object
      additionalProperties: false
      required:
      - field
      - reason
      properties:
        field:
          type: string
          description: JSON request field path using the request's property names, such as description or items[0].name.
        reason:
          type: string
          description: Stable machine-readable validation code, such as NotBlank, Pattern, Size, or CodePointSize
            for Unicode code-point length; never validation prose or a rejected value.
    WorkshopCreate:
      type: object
      additionalProperties: false
      required:
      - code
      - name
      - organizationId
      properties:
        code:
          $ref: '#/components/schemas/Code'
        name:
          $ref: '#/components/schemas/Name'
        organizationId:
          $ref: '#/components/schemas/CanonicalUuid'
        boundaryDescription:
          oneOf:
          - $ref: '#/components/schemas/Description'
          - type: 'null'
    WorkshopUpdate:
      type: object
      additionalProperties: false
      required:
      - expectedVersion
      - name
      properties:
        expectedVersion:
          $ref: '#/components/schemas/Version'
        name:
          $ref: '#/components/schemas/Name'
        boundaryDescription:
          oneOf:
          - $ref: '#/components/schemas/Description'
          - type: 'null'
      description: Complete mutable field set, not merge patch. Missing optional descriptions normalize to null.
        Immutable identity, organization, source and code keys are rejected.
    ProductionLineCreate:
      type: object
      additionalProperties: false
      required:
