x-transport-rules:
  unknownProperties: reject
  duplicateProperties: reject
  invalidUtf8OrUnpairedSurrogates: reject
  mediaType: application/json; optional UTF-8 charset only; no sniffing
  mutationQueryParameters: none
  idempotencyKey: exactly one canonical lowercase UUID header; no duplicates/comma lists
  mutableUpdate: complete mutable set; omitted optional descriptions normalize null
  timestamps: explicit offset; valid finite0001..9999; microseconds; normalized UTC
  integerTokens: no string/float/exponent coercion
  text: Unicode code-point bounds; exact preserved value, no whitespace/case/NFC normalization
  clientAuthority: actor/account/tenant/member/action/permission are server derived and forbidden in bodies
x-cache-semantics: Use W/"sha256" semantic ETags over the effective projection, READ/CREATE use and hashed server-derived
  context/current authority versions. Per-request envelope IDs are excluded. Authorize before If-None-Match including
  wildcard and list forms; weak comparison for GET. A denial or unavailable authority cannot become 304. Weak validators
  are not If-Match write proofs. Bodyless 304 retains ETag, Cache-Control and Vary. No shared cache.
