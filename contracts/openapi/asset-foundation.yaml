          - $ref: '#/components/schemas/MicrosecondInstant'
          - type: 'null'
        endObservedAt:
          oneOf:
          - $ref: '#/components/schemas/MicrosecondInstant'
          - type: 'null'
      description: Immutable recorded binding revision; never current mutable labels relabeled as historical facts.
        Directory snapshots are observed at directoryObservedAt, not validFrom. Minimal endpoint snapshots are authorized
        relationship history under parent READ, without requiring current endpoint READ; navigating to current endpoint
        detail still requires its independent READ and scope. No receipt fingerprints or server actor envelope is
        disclosed.
