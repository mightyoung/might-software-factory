          $ref: '#/components/schemas/Version'
        code:
          $ref: '#/components/schemas/Code'
        name:
          $ref: '#/components/schemas/Name'
      description: Exact immutable endpoint root-revision snapshot at BIND. version is the business version, never
        technical fence revision. id equals the corresponding endpointId. END retains the original snapshot. Labels
        are not current, validFrom-time or timestamp-as-of labels; no extra endpoint fields are disclosed.
    LineWorkshopHistoryItem:
      type: object
      additionalProperties: false
      required:
      - commandId
      - id
      - resourceType
      - version
      - changeKind
      - occurredAt
      - lineId
      - workshopId
      - lineAtBind
      - workshopAtBind
      - validFrom
      - validTo
      - endObservedAt
      properties:
        commandId:
          $ref: '#/components/schemas/CanonicalUuid'
        id:
          $ref: '#/components/schemas/CanonicalUuid'
        resourceType:
          type: string
          const: line_workshop
        version:
          $ref: '#/components/schemas/Version'
        changeKind:
          type: string
          enum:
          - BIND
          - END
        occurredAt:
          $ref: '#/components/schemas/MicrosecondInstant'
        lineId:
          $ref: '#/components/schemas/CanonicalUuid'
        workshopId:
          $ref: '#/components/schemas/CanonicalUuid'
        lineAtBind:
          $ref: '#/components/schemas/EndpointAtBindSnapshot'
        workshopAtBind:
          $ref: '#/components/schemas/EndpointAtBindSnapshot'
        validFrom:
          $ref: '#/components/schemas/MicrosecondInstant'
        validTo:
