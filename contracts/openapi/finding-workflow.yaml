openapi: 3.1.0
info:
  title: Might Software Factory Finding Workflow API
  version: 1.0.0
  description: >-
    Session-authenticated commands for finding creation, the required person and safety
    confirmations, safety dispatch, remediation submission, safety acceptance, and authorized reads
    of submitted evidence content. The command service is the only writer of the finding workflow projection.
x-implementation-status: local-command-service-flowable-facade-and-opt-in-pinned-evidence-reader
x-tenant-context: >-
  Tenant, actor, account, and member are resolved from the verified server session. Request bodies
  and headers cannot select the actor, tenant, member, permission, or workflow assignee for approval.
  The created organization must be in the caller's current action scope.
x-workflow-order:
  - PERSON_CONFIRM_PENDING
  - SAFETY_CONFIRM_PENDING
  - NOT_ESTABLISHED
  - SAFETY_DISPATCH_PENDING
  - RECTIFYING
  - ACCEPTANCE_PENDING
  - CLOSED
x-confirmation-terminal-outcomes:
  NOT_ESTABLISHED: >-
    Either confirmation stage may end its review branch as not established with a required opinion.
    This is distinct from CLOSED, which remains the successful remediation acceptance outcome.
x-confirmation-idempotency-compatibility: >-
  Existing confirmation command receipts are immutable. This contract retains the
  confirmation-payload-v2 fingerprint name while normalizing opinions with Unicode White_Space
  trimming. A receipt produced by the earlier String.strip normalization can conflict when the
  original opinion has leading or trailing Unicode White_Space such as NBSP. Before rollout,
  clients must read back the finding, confirmation opinion, grade, and version to reconcile any
  previously completed action; they must not overwrite or assume absence of an old receipt. Use a
  new idempotency key only for an action the current state still accepts, after reconciliation.
x-remediation-loop: >-
  A failed safety verification requires a reason, retains the failed round, and routes through a
  safety re-dispatch before the new remediation notice is issued. Only a passing safety verification
  closes the finding. The remediation submitter cannot verify their own submission.
servers:
  - url: /
paths:
  /api/v1/findings:
    post:
      operationId: createFinding
      summary: Create a finding and start its required confirmation workflow
      description: >-
        Starts at PERSON_CONFIRM_PENDING. The server resolves one effective member for each
        confirmation/dispatch stage. PERSON and SAFETY confirmers must be distinct from one another
        and from the reporter; missing or ambiguous route configuration fails closed.
        The server allocates code as YH-YYYYMMDD-NNNN using a tenant-local Asia/Shanghai submission
        day sequence. A completed idempotent replay returns the original finding ID and code.
        The server calculates backfill as true only when discoveredAt is more than 24 hours before
        its submission time; exactly 24 hours and future timestamps produce false. This uses the
        compared instants, independent of the submitted offsets. No new future-time restriction is
        introduced. The server owns backfill and rejects it in create requests. An optional
        relatedFindingId links new evidence to a same-tenant parent in NOT_ESTABLISHED; the caller
        needs finding.create for the new record and finding.read for the parent. A missing,
        cross-tenant, or unreadable parent has the same 404 response. A visible parent in another
        state returns 422 WORKFLOW_RULE. Creating the related record never updates or reopens its parent.
      security:
        - sessionCookieAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFindingRequest'
      responses:
        '200':
          description: Finding created or the original response for an idempotent replay.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ActionDenied'
        '404':
          $ref: '#/components/responses/NotVisible'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '422':
          $ref: '#/components/responses/WorkflowRule'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'

  /api/v1/findings/{id}/workflow-initialization:
    post:
      operationId: initializeLegacyDiscoveredFinding
      summary: Start the confirmation workflow for one preserved legacy discovery
      description: >-
        Explicitly moves a legacy DISCOVERED row to PERSON_CONFIRM_PENDING, creates the first
        confirmation task, and records the transition. Initialization does not perform confirmation.
      security:
        - sessionCookieAuth: []
      parameters:
        - $ref: '#/components/parameters/FindingId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VersionedCommandRequest'
      responses:
        '200':
          $ref: '#/components/responses/CommandSucceeded'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ActionDenied'
        '404':
          $ref: '#/components/responses/NotVisible'
        '409':
          $ref: '#/components/responses/CommandConflict'
        '422':
          $ref: '#/components/responses/WorkflowRule'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'

  /api/v1/findings/{id}/confirm/person:
    post:
      operationId: confirmFindingByPerson
      summary: Complete the required first person confirmation
      security:
        - sessionCookieAuth: []
      parameters:
        - $ref: '#/components/parameters/FindingId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PersonConfirmationRequest'
      responses:
        '200':
          $ref: '#/components/responses/CommandSucceeded'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ActionDenied'
        '404':
          $ref: '#/components/responses/NotVisible'
        '409':
          $ref: '#/components/responses/CommandConflict'
        '422':
          $ref: '#/components/responses/WorkflowRule'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'

  /api/v1/findings/{id}/confirm/safety:
    post:
      operationId: confirmFindingBySafety
      summary: Complete the separate safety department confirmation
      security:
        - sessionCookieAuth: []
      parameters:
        - $ref: '#/components/parameters/FindingId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SafetyConfirmationRequest'
      responses:
        '200':
          $ref: '#/components/responses/CommandSucceeded'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ActionDenied'
        '404':
          $ref: '#/components/responses/NotVisible'
        '409':
          $ref: '#/components/responses/CommandConflict'
        '422':
          $ref: '#/components/responses/WorkflowRule'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'

  /api/v1/findings/{id}/close-not-established:
    post:
      operationId: closeFindingAsNotEstablished
      summary: Close a finding as not established at the current confirmation stage
      description: >-
        The stage must match the current pending confirmation state. PERSON requires
        finding.confirm.person and SAFETY requires finding.confirm.safety; neither confirmer may be
        the reporter, and the SAFETY confirmer must differ from the recorded PERSON confirmer. This
        command does not accept a grade; the finding's existing grade is preserved. Normal SAFETY
        approval still requires a GENERAL or MAJOR grade. The required opinion is retained in the
        confirmation, transition, and audit record. Stage, opinion, expectedVersion, and the
        authenticated actor participate in idempotency. Existing findingRemediationV1 instances are
        not migrated automatically; this command returns 409 COMMAND_CONFLICT for them before writing
        a receipt. Continue the existing V1 approval path or use a separately reviewed instance
        migration; do not retry the close with a new key.
      security:
        - sessionCookieAuth: []
      parameters:
        - $ref: '#/components/parameters/FindingId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotEstablishedRequest'
      responses:
        '200':
          $ref: '#/components/responses/CommandSucceeded'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ActionDenied'
        '404':
          $ref: '#/components/responses/NotVisible'
        '409':
          $ref: '#/components/responses/CommandConflict'
        '422':
          $ref: '#/components/responses/WorkflowRule'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'

  /api/v1/findings/{id}/dispatch:
    post:
      operationId: dispatchFindingRemediation
      summary: Issue a remediation notice and assign its first round
      description: Requires both confirmation nodes and the current safety dispatch task.
      security:
        - sessionCookieAuth: []
      parameters:
        - $ref: '#/components/parameters/FindingId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DispatchRequest'
      responses:
        '200':
          $ref: '#/components/responses/CommandSucceeded'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ActionDenied'
        '404':
          $ref: '#/components/responses/NotVisible'
        '409':
          $ref: '#/components/responses/CommandConflict'
        '422':
          $ref: '#/components/responses/WorkflowRule'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'

  /api/v1/findings/{id}/remediation-submissions:
    post:
      operationId: submitFindingRemediation
      summary: Submit remediation for safety acceptance
      description: >-
        Requires the current assigned remediation member, a current version, a statement, and a
        same-tenant READY evidence set containing at least one READY evidence item.
      security:
        - sessionCookieAuth: []
      parameters:
        - $ref: '#/components/parameters/FindingId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RemediationSubmissionRequest'
      responses:
        '200':
          $ref: '#/components/responses/CommandSucceeded'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ActionDenied'
        '404':
          $ref: '#/components/responses/NotVisible'
        '409':
          $ref: '#/components/responses/CommandConflict'
        '422':
          $ref: '#/components/responses/WorkflowRule'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'

  /api/v1/findings/{id}/verifications:
    post:
      operationId: verifyFindingRemediation
      summary: Accept or return the current remediation round
      description: >-
        Only the configured, currently authorized safety verifier can act. PASS closes the finding.
        FAIL requires a reason, preserves this round's submission and verification, and returns to
        RECTIFYING with a new round and notice. The submitter cannot verify their own work.
      security:
        - sessionCookieAuth: []
      parameters:
        - $ref: '#/components/parameters/FindingId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerificationRequest'
      responses:
        '200':
          $ref: '#/components/responses/CommandSucceeded'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ActionDenied'
        '404':
          $ref: '#/components/responses/NotVisible'
        '409':
          $ref: '#/components/responses/CommandConflict'
        '422':
          $ref: '#/components/responses/WorkflowRule'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'

  /api/v1/findings/{findingId}/remediation-rounds/{roundNo}/evidence-items/{evidenceItemId}/content:
    get:
      operationId: readSubmittedFindingEvidenceContent
      summary: Download content pinned by a sealed remediation submission
      description: >-
        Requires the current finding read permission and an active file link. The server resolves the file,
        receipt, digest, and immutable storage version from the sealed submission snapshot and verifies the
        bytes before streaming. This route does not accept a file ID, object key, storage path, or storage
        version from the caller. Missing, unsealed, revoked, or out-of-scope evidence is hidden as not visible.
        The local filesystem adapter is disabled unless a private root and receipt trust key are explicitly
        configured; without a trusted reader the request fails closed.
      security:
        - sessionCookieAuth: []
      parameters:
        - $ref: '#/components/parameters/FindingResourceId'
        - $ref: '#/components/parameters/RoundNo'
        - $ref: '#/components/parameters/EvidenceItemId'
      responses:
        '200':
          description: Verified bytes from the exact immutable version in the sealed evidence snapshot.
          headers:
            Content-Disposition:
              schema: { type: string }
            Cache-Control:
              schema: { type: string }
            X-Content-Type-Options:
              schema: { type: string }
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ActionDenied'
        '404':
          $ref: '#/components/responses/NotVisible'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'

components:
  securitySchemes:
    sessionCookieAuth:
      type: apiKey
      in: cookie
      name: SESSION
  parameters:
    FindingId:
      in: path
      name: id
      required: true
      schema:
        type: string
        format: uuid
    FindingResourceId:
      in: path
      name: findingId
      required: true
      schema:
        type: string
        format: uuid
    RoundNo:
      in: path
      name: roundNo
      required: true
      schema:
        type: integer
        minimum: 1
    EvidenceItemId:
      in: path
      name: evidenceItemId
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      description: UUID retained with the tenant, actor, action, request hash, and original result.
      schema:
        type: string
        format: uuid
    CsrfToken:
      in: header
      name: X-XSRF-TOKEN
      required: true
      description: Must match the server-issued XSRF-TOKEN cookie.
      schema:
        type: string
  responses:
    CommandSucceeded:
      description: Command applied or original idempotent result returned.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CommandResponse'
    InvalidRequest:
      description: >-
        Bean Validation failures return INVALID_REQUEST with fieldErrors. Malformed JSON or JSON-to-request
        binding failures return INVALID_QUERY with an empty fieldErrors array. Opinion-only Unicode
        White_Space returns INVALID_REQUEST with reason OpinionNotBlank. Unsupported create, person
        confirmation, safety confirmation, and not-established close fields return INVALID_QUERY;
        other lifecycle command DTOs currently ignore unknown properties for compatibility.
      content:
        application/json:
          schema:
            $ref: 'entity-query.yaml#/components/schemas/ErrorResponse'
          examples:
            fieldValidation:
              summary: Field validation error
              value:
                code: INVALID_REQUEST
                message: The finding command request is invalid
                traceId: 4bc63d9e-73f5-4f58-a79a-e8e22fa0c2d7
                retryable: false
                fieldErrors:
                  - field: description
                    reason: Size
            malformedJsonOrBinding:
              summary: Malformed JSON or JSON-to-request type binding failure
              value:
                code: INVALID_QUERY
                message: The finding request is invalid
                traceId: 4bc63d9e-73f5-4f58-a79a-e8e22fa0c2d7
                retryable: false
                fieldErrors: []
            unsupportedCreateField:
              summary: The create command contains an unsupported field
              value:
                code: INVALID_QUERY
                message: The finding request is invalid
                traceId: 4bc63d9e-73f5-4f58-a79a-e8e22fa0c2d7
                retryable: false
                fieldErrors: []
    Unauthenticated:
      description: A verified session is required.
      content:
        application/json:
          schema:
            $ref: 'entity-query.yaml#/components/schemas/ErrorResponse'
          examples:
            genericAuthenticationFailure:
              value:
                code: AUTH_REQUIRED
                message: A verified session is required
                traceId: 4bc63d9e-73f5-4f58-a79a-e8e22fa0c2d7
                retryable: false
                fieldErrors: []
    ActionDenied:
      description: Current member, action permission, assignment, or CSRF check failed.
      content:
        application/json:
          schema:
            $ref: 'entity-query.yaml#/components/schemas/ErrorResponse'
          examples:
            genericCsrfFailure:
              value:
                code: ACTION_DENIED
                message: The request is not allowed
                traceId: 4bc63d9e-73f5-4f58-a79a-e8e22fa0c2d7
                retryable: false
                fieldErrors: []
    NotVisible:
      description: The finding is missing or outside current tenant/organization scope.
      content:
        application/json:
          schema:
            $ref: 'entity-query.yaml#/components/schemas/ErrorResponse'
    CommandConflict:
      description: >-
        A lifecycle command can fail because the expected version is stale, the idempotency key was
        reused for a different command, or the workflow task state changed. Use code to distinguish
        VERSION_CONFLICT, IDEMPOTENCY_CONFLICT, and the compatible generic COMMAND_CONFLICT.
      content:
        application/json:
          schema:
            $ref: 'entity-query.yaml#/components/schemas/ErrorResponse'
          examples:
            versionConflict:
              summary: The expected version is stale
              value:
                code: VERSION_CONFLICT
                message: The finding version is stale
                traceId: 4bc63d9e-73f5-4f58-a79a-e8e22fa0c2d7
                retryable: false
                fieldErrors: []
            idempotencyConflict:
              summary: The key was reused for a different command
              value:
                code: IDEMPOTENCY_CONFLICT
                message: The idempotency key conflicts with a prior command
                traceId: 4bc63d9e-73f5-4f58-a79a-e8e22fa0c2d7
                retryable: false
                fieldErrors: []
            workflowStateConflict:
              summary: The workflow task state conflicts with the command
              value:
                code: COMMAND_CONFLICT
                message: The finding changed or this command key conflicts with a previous command
                traceId: 4bc63d9e-73f5-4f58-a79a-e8e22fa0c2d7
                retryable: false
                fieldErrors: []
    IdempotencyConflict:
      description: The idempotency key was reused for a different command.
      content:
        application/json:
          schema:
            $ref: 'entity-query.yaml#/components/schemas/ErrorResponse'
          examples:
            idempotencyConflict:
              value:
                code: IDEMPOTENCY_CONFLICT
                message: The idempotency key conflicts with a prior command
                traceId: 4bc63d9e-73f5-4f58-a79a-e8e22fa0c2d7
                retryable: false
                fieldErrors: []
    WorkflowRule:
      description: Current state, required evidence, or assignment configuration blocks the command.
      content:
        application/json:
          schema:
            $ref: 'entity-query.yaml#/components/schemas/ErrorResponse'
    DependencyUnavailable:
      description: Database or embedded workflow could not safely complete the command.
      content:
        application/json:
          schema:
            $ref: 'entity-query.yaml#/components/schemas/ErrorResponse'
          examples:
            retryableDependencyFailure:
              value:
                code: DEPENDENCY_UNAVAILABLE
                message: The finding command could not be completed safely
                traceId: 4bc63d9e-73f5-4f58-a79a-e8e22fa0c2d7
                retryable: true
                fieldErrors: []
  schemas:
    CreateFindingRequest:
      type: object
      additionalProperties: false
      description: >-
        The create endpoint rejects unknown properties at runtime; the server assigns the business code
        and the backfill flag. Source and urgency are reporter choices and do not set the professional grade.
        relatedFindingId is optional and only accepts a same-tenant NOT_ESTABLISHED parent; the parent
        is not reopened or changed.
      required: [organizationId, description, discoveredAt, grade, sourceCategory, urgency, location]
      properties:
        organizationId: { type: string, format: uuid }
        description: { type: string, minLength: 1, maxLength: 20000 }
        discoveredAt: { type: string, format: date-time }
        sourceEventId: { type: string, format: uuid }
        riskId: { type: string, format: uuid }
        grade:
          type: string
          enum: [UNKNOWN]
          description: The reporter cannot assign a professional finding grade.
        sourceCategory:
          type: string
          enum: [FIELD_OBSERVATION, INSPECTION, PERSON_REPORT]
          description: >-
            现场发现 (FIELD_OBSERVATION), 检查发现 (INSPECTION), or 人员举报 (PERSON_REPORT).
            Describes the source of the report, not its grade.
        urgency:
          type: string
          enum: [NORMAL, URGENT]
          description: 普通 (NORMAL) or 需立即处置 (URGENT); independent of finding grade.
        location:
          type: string
          minLength: 1
          maxLength: 200
          pattern: '[\s\S]*[^\u0009-\u000D\u0020\u0085\u00A0\u1680\u2000-\u200A\u2028\u2029\u202F\u205F\u3000][\s\S]*'
          description: >-
            Required location using a maximum of 200 Unicode code points. It must contain a code point
            outside Unicode White_Space: U+0009–U+000D, U+0020, U+0085, U+00A0, U+1680, U+2000–U+200A,
            U+2028, U+2029, U+202F, U+205F, or U+3000.
        interimMeasure:
          type: string
          maxLength: 2000
          description: Optional temporary measure using a maximum of 2000 Unicode code points.
        relatedFindingId:
          type: string
          format: uuid
          description: Optional same-tenant NOT_ESTABLISHED parent to associate with new evidence.
    VersionedCommandRequest:
      type: object
      additionalProperties: false
      description: >-
        Client requests must contain only documented properties. For compatibility, the current runtime ignores
        unknown properties on lifecycle commands; additionalProperties false describes the client contract and
        does not promise that the current server rejects unknown properties.
      required: [expectedVersion]
      properties:
        expectedVersion: { type: integer, minimum: 1 }
    PersonConfirmationRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, reason]
      properties:
        expectedVersion: { type: integer, minimum: 1 }
        reason:
          type: string
          minLength: 1
          maxLength: 4000
          description: >-
            Raw input is limited to 4000 Java UTF-16 code units before trimming. Trimming uses Unicode
            White_Space (U+0009–U+000D, U+0020, U+0085, U+00A0, U+1680, U+2000–U+200A, U+2028,
            U+2029, U+202F, U+205F, U+3000); at least one other code point is required.
    SafetyConfirmationRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, reason, grade]
      properties:
        expectedVersion: { type: integer, minimum: 1 }
        reason:
          type: string
          minLength: 1
          maxLength: 4000
          description: >-
            Raw input is limited to 4000 Java UTF-16 code units before trimming. Trimming uses Unicode
            White_Space (U+0009–U+000D, U+0020, U+0085, U+00A0, U+1680, U+2000–U+200A, U+2028,
            U+2029, U+202F, U+205F, U+3000); at least one other code point is required.
        grade:
          type: string
          enum: [GENERAL, MAJOR]
          description: Professional grade assigned by the safety confirmer.
    NotEstablishedRequest:
      type: object
      additionalProperties: false
      description: >-
        The stage must match the pending confirmation. This action does not accept or assign a grade;
        the finding's existing grade is preserved. The reason is recorded in the confirmation,
        transition, and audit event.
      required: [expectedVersion, stage, reason]
      properties:
        expectedVersion: { type: integer, minimum: 1 }
        stage: { type: string, enum: [PERSON, SAFETY] }
        reason:
          type: string
          minLength: 1
          maxLength: 4000
          description: >-
            Raw input is limited to 4000 Java UTF-16 code units before trimming. Trimming uses Unicode
            White_Space (U+0009–U+000D, U+0020, U+0085, U+00A0, U+1680, U+2000–U+200A, U+2028,
            U+2029, U+202F, U+205F, U+3000); at least one other code point is required.
    DispatchRequest:
      type: object
      additionalProperties: false
      description: >-
        Client requests must contain only documented properties. For compatibility, the current runtime ignores
        unknown properties on lifecycle commands; additionalProperties false describes the client contract and
        does not promise that the current server rejects unknown properties.
      required: [expectedVersion, assigneeMemberId, dueAt, requirements]
      properties:
        expectedVersion: { type: integer, minimum: 1 }
        assigneeMemberId: { type: string, format: uuid }
        dueAt: { type: string, format: date-time }
        requirements: { type: string, minLength: 1, maxLength: 4000 }
    RemediationSubmissionRequest:
      type: object
      additionalProperties: false
      description: >-
        Client requests must contain only documented properties. For compatibility, the current runtime ignores
        unknown properties on lifecycle commands; additionalProperties false describes the client contract and
        does not promise that the current server rejects unknown properties.
      required: [expectedVersion, evidenceSetId, statement]
      properties:
        expectedVersion: { type: integer, minimum: 1 }
        evidenceSetId: { type: string, format: uuid }
        statement: { type: string, minLength: 1, maxLength: 4000 }
    VerificationRequest:
      type: object
      additionalProperties: false
      description: >-
        Client requests must contain only documented properties. For compatibility, the current runtime ignores
        unknown properties on lifecycle commands; additionalProperties false describes the client contract and
        does not promise that the current server rejects unknown properties.
      required: [expectedVersion, decision]
      properties:
        expectedVersion: { type: integer, minimum: 1 }
        decision: { type: string, enum: [PASS, FAIL] }
        reason:
          type: string
          maxLength: 4000
          description: Required by the service when decision is FAIL.
    CommandResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [findingId, code, state, roundNo, version]
          properties:
            findingId: { type: string, format: uuid }
            code:
              type: string
              pattern: '^YH-[0-9]{8}-[0-9]{4,}$'
            state:
              type: string
              enum: [DISCOVERED, PERSON_CONFIRM_PENDING, SAFETY_CONFIRM_PENDING,
                     SAFETY_DISPATCH_PENDING, RECTIFYING, ACCEPTANCE_PENDING, CLOSED]
            roundNo: { type: integer, minimum: 1 }
            version: { type: integer, minimum: 1 }
