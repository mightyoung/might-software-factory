openapi: 3.1.0
info:
  title: Might Software Factory Finding Workflow API
  version: 1.0.0
  description: >-
    Session-authenticated commands for finding creation, the required person and safety
    confirmations, safety dispatch, remediation submission, safety acceptance, and authorized reads
    of submitted evidence content. The command service is the only writer of the finding workflow projection.
x-implementation-status: local-command-service-flowable-facade-and-opt-in-pinned-evidence-reader
x-tenant-context: >-
  Tenant, actor, account, and member are resolved from the verified server session. Request bodies
  and headers cannot select the actor, tenant, member, permission, or workflow assignee for approval.
  The created organization must be in the caller's current action scope.
x-workflow-order:
  - PERSON_CONFIRM_PENDING
  - SAFETY_CONFIRM_PENDING
  - SAFETY_DISPATCH_PENDING
  - RECTIFYING
  - ACCEPTANCE_PENDING
  - CLOSED
x-remediation-loop: >-
  A failed safety verification requires a reason, retains the failed round, and routes through a
  safety re-dispatch before the new remediation notice is issued. Only a passing safety verification
  closes the finding. The remediation submitter cannot verify their own submission.
servers:
  - url: /
paths:
  /api/v1/findings:
    post:
      operationId: createFinding
      summary: Create a finding and start its required confirmation workflow
      description: >-
        Starts at PERSON_CONFIRM_PENDING. The server resolves one effective member for each
        confirmation/dispatch stage. Missing or ambiguous route configuration fails closed.
      security:
        - sessionCookieAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFindingRequest'
      responses:
        '200':
          description: Finding created or the original response for an idempotent replay.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ActionDenied'
        '404':
          $ref: '#/components/responses/NotVisible'
        '409':
          $ref: '#/components/responses/CommandConflict'
        '422':
          $ref: '#/components/responses/WorkflowRule'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'

  /api/v1/findings/{id}/workflow-initialization:
    post:
      operationId: initializeLegacyDiscoveredFinding
      summary: Start the confirmation workflow for one preserved legacy discovery
      description: >-
        Explicitly moves a legacy DISCOVERED row to PERSON_CONFIRM_PENDING, creates the first
        confirmation task, and records the transition. Initialization does not perform confirmation.
      security:
        - sessionCookieAuth: []
      parameters:
        - $ref: '#/components/parameters/FindingId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VersionedCommandRequest'
      responses:
        '200':
          $ref: '#/components/responses/CommandSucceeded'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ActionDenied'
        '404':
          $ref: '#/components/responses/NotVisible'
        '409':
          $ref: '#/components/responses/CommandConflict'
        '422':
          $ref: '#/components/responses/WorkflowRule'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'

  /api/v1/findings/{id}/confirm/person:
    post:
      operationId: confirmFindingByPerson
      summary: Complete the required first person confirmation
      security:
        - sessionCookieAuth: []
      parameters:
        - $ref: '#/components/parameters/FindingId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VersionedCommandRequest'
      responses:
        '200':
          $ref: '#/components/responses/CommandSucceeded'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ActionDenied'
        '404':
          $ref: '#/components/responses/NotVisible'
        '409':
          $ref: '#/components/responses/CommandConflict'
        '422':
          $ref: '#/components/responses/WorkflowRule'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'

  /api/v1/findings/{id}/confirm/safety:
    post:
      operationId: confirmFindingBySafety
      summary: Complete the separate safety department confirmation
      security:
        - sessionCookieAuth: []
      parameters:
        - $ref: '#/components/parameters/FindingId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VersionedCommandRequest'
      responses:
        '200':
          $ref: '#/components/responses/CommandSucceeded'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ActionDenied'
        '404':
          $ref: '#/components/responses/NotVisible'
        '409':
          $ref: '#/components/responses/CommandConflict'
        '422':
          $ref: '#/components/responses/WorkflowRule'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'

  /api/v1/findings/{id}/dispatch:
    post:
      operationId: dispatchFindingRemediation
      summary: Issue a remediation notice and assign its first round
      description: Requires both confirmation nodes and the current safety dispatch task.
      security:
        - sessionCookieAuth: []
      parameters:
        - $ref: '#/components/parameters/FindingId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DispatchRequest'
      responses:
        '200':
          $ref: '#/components/responses/CommandSucceeded'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ActionDenied'
        '404':
          $ref: '#/components/responses/NotVisible'
        '409':
          $ref: '#/components/responses/CommandConflict'
        '422':
          $ref: '#/components/responses/WorkflowRule'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'

  /api/v1/findings/{id}/remediation-submissions:
    post:
      operationId: submitFindingRemediation
      summary: Submit remediation for safety acceptance
      description: >-
        Requires the current assigned remediation member, a current version, a statement, and a
        same-tenant READY evidence set containing at least one READY evidence item.
      security:
        - sessionCookieAuth: []
      parameters:
        - $ref: '#/components/parameters/FindingId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RemediationSubmissionRequest'
      responses:
        '200':
          $ref: '#/components/responses/CommandSucceeded'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ActionDenied'
        '404':
          $ref: '#/components/responses/NotVisible'
        '409':
          $ref: '#/components/responses/CommandConflict'
        '422':
          $ref: '#/components/responses/WorkflowRule'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'

  /api/v1/findings/{id}/verifications:
    post:
      operationId: verifyFindingRemediation
      summary: Accept or return the current remediation round
      description: >-
        Only the configured, currently authorized safety verifier can act. PASS closes the finding.
        FAIL requires a reason, preserves this round's submission and verification, and returns to
        RECTIFYING with a new round and notice. The submitter cannot verify their own work.
      security:
        - sessionCookieAuth: []
      parameters:
        - $ref: '#/components/parameters/FindingId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerificationRequest'
      responses:
        '200':
          $ref: '#/components/responses/CommandSucceeded'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ActionDenied'
        '404':
          $ref: '#/components/responses/NotVisible'
        '409':
          $ref: '#/components/responses/CommandConflict'
        '422':
          $ref: '#/components/responses/WorkflowRule'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'

  /api/v1/findings/{findingId}/remediation-rounds/{roundNo}/evidence-items/{evidenceItemId}/content:
    get:
      operationId: readSubmittedFindingEvidenceContent
      summary: Download content pinned by a sealed remediation submission
      description: >-
        Requires the current finding read permission and an active file link. The server resolves the file,
        receipt, digest, and immutable storage version from the sealed submission snapshot and verifies the
        bytes before streaming. This route does not accept a file ID, object key, storage path, or storage
        version from the caller. Missing, unsealed, revoked, or out-of-scope evidence is hidden as not visible.
        The local filesystem adapter is disabled unless a private root and receipt trust key are explicitly
        configured; without a trusted reader the request fails closed.
      security:
        - sessionCookieAuth: []
      parameters:
        - $ref: '#/components/parameters/FindingResourceId'
        - $ref: '#/components/parameters/RoundNo'
        - $ref: '#/components/parameters/EvidenceItemId'
      responses:
        '200':
          description: Verified bytes from the exact immutable version in the sealed evidence snapshot.
          headers:
            Content-Disposition:
              schema: { type: string }
            Cache-Control:
              schema: { type: string }
            X-Content-Type-Options:
              schema: { type: string }
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ActionDenied'
        '404':
          $ref: '#/components/responses/NotVisible'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'

components:
  securitySchemes:
    sessionCookieAuth:
      type: apiKey
      in: cookie
      name: SESSION
  parameters:
    FindingId:
      in: path
      name: id
      required: true
      schema:
        type: string
        format: uuid
    FindingResourceId:
      in: path
      name: findingId
      required: true
      schema:
        type: string
        format: uuid
    RoundNo:
      in: path
      name: roundNo
      required: true
      schema:
        type: integer
        minimum: 1
    EvidenceItemId:
      in: path
      name: evidenceItemId
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      description: UUID retained with the tenant, actor, action, request hash, and original result.
      schema:
        type: string
        format: uuid
    CsrfToken:
      in: header
      name: X-XSRF-TOKEN
      required: true
      description: Must match the server-issued XSRF-TOKEN cookie.
      schema:
        type: string
  responses:
    CommandSucceeded:
      description: Command applied or original idempotent result returned.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CommandResponse'
    InvalidRequest:
      description: Invalid body, version, identifier, or idempotency key.
      content:
        application/json:
          schema:
            $ref: 'entity-query.yaml#/components/schemas/ErrorResponse'
    Unauthenticated:
      description: A verified session is required.
      content:
        application/json:
          schema:
            $ref: 'entity-query.yaml#/components/schemas/ErrorResponse'
    ActionDenied:
      description: Current member, action permission, assignment, or CSRF check failed.
      content:
        application/json:
          schema:
            $ref: 'entity-query.yaml#/components/schemas/ErrorResponse'
    NotVisible:
      description: The finding is missing or outside current tenant/organization scope.
      content:
        application/json:
          schema:
            $ref: 'entity-query.yaml#/components/schemas/ErrorResponse'
    CommandConflict:
      description: Expected version is stale or idempotency key conflicts with a prior command.
      content:
        application/json:
          schema:
            $ref: 'entity-query.yaml#/components/schemas/ErrorResponse'
    WorkflowRule:
      description: Current state, required evidence, or assignment configuration blocks the command.
      content:
        application/json:
          schema:
            $ref: 'entity-query.yaml#/components/schemas/ErrorResponse'
    DependencyUnavailable:
      description: Database or embedded workflow could not safely complete the command.
      content:
        application/json:
          schema:
            $ref: 'entity-query.yaml#/components/schemas/ErrorResponse'
  schemas:
    CreateFindingRequest:
      type: object
      additionalProperties: false
      required: [organizationId, code, description, discoveredAt, grade]
      properties:
        organizationId: { type: string, format: uuid }
        code: { type: string, minLength: 1, maxLength: 64 }
        description: { type: string, minLength: 1, maxLength: 20000 }
        discoveredAt: { type: string, format: date-time }
        sourceEventId: { type: string, format: uuid }
        riskId: { type: string, format: uuid }
        grade: { type: string, enum: [UNKNOWN, GENERAL, MAJOR] }
    VersionedCommandRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion]
      properties:
        expectedVersion: { type: integer, minimum: 1 }
    DispatchRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, assigneeMemberId, dueAt, requirements]
      properties:
        expectedVersion: { type: integer, minimum: 1 }
        assigneeMemberId: { type: string, format: uuid }
        dueAt: { type: string, format: date-time }
        requirements: { type: string, minLength: 1, maxLength: 4000 }
    RemediationSubmissionRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, evidenceSetId, statement]
      properties:
        expectedVersion: { type: integer, minimum: 1 }
        evidenceSetId: { type: string, format: uuid }
        statement: { type: string, minLength: 1, maxLength: 4000 }
    VerificationRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, decision]
      properties:
        expectedVersion: { type: integer, minimum: 1 }
        decision: { type: string, enum: [PASS, FAIL] }
        reason:
          type: string
          maxLength: 4000
          description: Required by the service when decision is FAIL.
    CommandResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [findingId, state, roundNo, version]
          properties:
            findingId: { type: string, format: uuid }
            state:
              type: string
              enum: [DISCOVERED, PERSON_CONFIRM_PENDING, SAFETY_CONFIRM_PENDING,
                     SAFETY_DISPATCH_PENDING, RECTIFYING, ACCEPTANCE_PENDING, CLOSED]
            roundNo: { type: integer, minimum: 1 }
            version: { type: integer, minimum: 1 }
