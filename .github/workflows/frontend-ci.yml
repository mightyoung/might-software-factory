name: Frontend CI

on:
  pull_request:
    paths:
      - "frontend/**"
      - "contracts/**"
      - ".github/workflows/frontend-ci.yml"
  push:
    branches:
      - main
      - dev
    paths:
      - "frontend/**"
      - "contracts/**"
      - ".github/workflows/frontend-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.2"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Contract types are up to date
        id: contracts
        working-directory: frontend
        run: npm run check:api

      - name: Generated contract diagnostics
        if: failure() && steps.contracts.outcome == 'failure'
        working-directory: frontend
        run: |
          node tools/api-types/print-generated-diagnostics.mjs --preflight
          node tools/api-types/generate.mjs
          node tools/api-types/print-generated-diagnostics.mjs

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Unit tests
        working-directory: frontend
        run: npm test

      - name: Verify Astryx upgrade safeguards
        working-directory: frontend
        run: |
          node --test tools/upgrade-astryx.test.mjs
          npm exec --offline -- astryx theme build src/themes/might/mightTheme.ts --check
          node tools/generate-astryx-root-tokens.mjs --check

      - name: Production build
        working-directory: frontend
        run: npm run build

      - name: Bundle size budget
        working-directory: frontend
        run: npm run check:bundle

      - name: Smoke test the synthetic production build in Chrome
        working-directory: frontend
        env:
          E2E_PREVIEW: synthetic
        run: npm run e2e

  e2e:
    # 浏览器端到端：对着契约模拟服务（不是后端）。使用 runner 自带的 Google Chrome，不下载浏览器。
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.2"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Chrome is available
        run: google-chrome --version

      - name: Build and measure the HTTP production bundle
        working-directory: frontend
        env:
          VITE_API_MODE: http
        run: npm run build && npm run check:bundle

      - name: HTTP production end-to-end tests
        env:
          E2E_PREVIEW: http
        working-directory: frontend
        run: npm run e2e

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: frontend/test-results/
          retention-days: 7
