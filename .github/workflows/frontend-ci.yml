name: Frontend CI

on:
  pull_request:
    paths:
      - "frontend/**"
      - "contracts/**"
      - ".github/workflows/frontend-ci.yml"
  push:
    branches:
      - main
      - dev
    paths:
      - "frontend/**"
      - "contracts/**"
      - ".github/workflows/frontend-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.2"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Contract types are up to date
        id: contracts
        working-directory: frontend
        run: npm run check:api

      - name: Generated contract diagnostics
        if: failure() && steps.contracts.outcome == 'failure'
        working-directory: frontend
        run: |
          node tools/api-types/print-generated-diagnostics.mjs --preflight
          node tools/api-types/generate.mjs
          node tools/api-types/print-generated-diagnostics.mjs

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Unit tests
        working-directory: frontend
        run: npm test

      - name: Production build
        working-directory: frontend
        run: npm run build
