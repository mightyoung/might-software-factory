name: Ledger configuration CI
on:
  pull_request:
    paths:
      - 'backend/**'
      - 'tools/ledger-configuration/**'
      - '.github/workflows/ledger-configuration-ci.yml'
      - 'pom.xml'
  push:
    branches: [dev, main]
    paths:
      - 'backend/**'
      - 'tools/ledger-configuration/**'
      - '.github/workflows/ledger-configuration-ci.yml'
      - 'pom.xml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  configuration-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-bookworm
        env:
          POSTGRES_DB: ledger_configuration_test
          POSTGRES_PASSWORD: ci_configuration_admin_only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d ledger_configuration_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      PGHOST: 127.0.0.1
      PGUSER: postgres
      PGDATABASE: ledger_configuration_test
      PGPASSWORD: ci_configuration_admin_only
      AUTHZ_CONFIG_PG_URL: jdbc:postgresql://127.0.0.1:5432/ledger_configuration_test
      AUTHZ_CONFIG_PG_USER: msf_dev_runtime_20261107
      AUTHZ_CONFIG_PG_PASSWORD: ci_configuration_probe_only
      AUTHZ_CONFIG_TENANT: 11111111-1111-4111-8111-111111111111
      AUTHZ_CONFIG_ORG: 33333333-3333-4333-8333-333333333333
      AUTHZ_CONFIG_OTHER_ORG: 44444444-4444-4444-8444-444444444444
      AUTHZ_CONFIG_MEMBER: 22222222-2222-4222-8222-222222222222
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Apply actual configuration migration to a fresh fixture
        run: |
          psql -v ON_ERROR_STOP=1 -f tools/ledger-configuration/prepare-test-database.sql
          psql -v ON_ERROR_STOP=1 -f backend/src/main/resources/db/migration/V36__ledger_configuration_versions.sql
          psql -v ON_ERROR_STOP=1 -f backend/src/main/resources/db/migration/V37__ordinary_ledger_records.sql
          psql -v ON_ERROR_STOP=1 -f backend/src/main/resources/db/operator/V36-runtime-grants.sql
          psql -v ON_ERROR_STOP=1 -f backend/src/main/resources/db/operator/V37-runtime-grants.sql
      - name: Verify permissions, version history, concurrency and tenant isolation
        run: ./mvnw -B -ntp -pl backend -am test -Dtest=LedgerConfigurationServiceTest,LedgerConfigurationPostgresTest,RuntimeLedger*Test -Dsurefire.failIfNoSpecifiedTests=false
