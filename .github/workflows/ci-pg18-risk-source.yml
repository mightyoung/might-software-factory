name: PostgreSQL 18 actual risk source acceptance

on:
  pull_request:
    paths:
      - "backend/**"
      - "pom.xml"
      - "mvnw"
      - ".mvn/**"
      - "tools/ci_pg18/**"
      - ".github/workflows/ci-pg18-risk-source.yml"
  push:
    branches: [main, dev]
    paths:
      - "backend/**"
      - "pom.xml"
      - "mvnw"
      - ".mvn/**"
      - "tools/ci_pg18/**"
      - ".github/workflows/ci-pg18-risk-source.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pg18-risk-source:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Verify all lanes' report, target and cleanup guards
        run: python3 -B -m unittest discover -s tools/ci_pg18 -p 'test_*.py' -v
      - name: Compile source IT and run offline target guards before creating credentials
        run: ./mvnw --batch-mode --no-transfer-progress -Pci-pg18-risk-source -Dtest=CiPg18SourceTargetTest,CiPg18SourceDiagnosticsTest test
      - name: Verify actual source transaction on isolated PostgreSQL 18
        run: python3 -B tools/ci_pg18/risk_source.py run
      - name: Always clean only this job's source container and secrets
        if: always()
        run: python3 -B tools/ci_pg18/risk_source.py cleanup
      - name: Upload bounded source acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pg18-risk-source-evidence
          path: artifacts/ci-pg18-risk-source/result.json
          if-no-files-found: error
          retention-days: 7
