name: Backend CI

on:
  pull_request:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify dependency evidence tool
        run: python3 -B -m unittest discover -s tools/p0 -p 'test_*.py' -v
      - name: Verify backend
        run: ./mvnw --batch-mode --no-transfer-progress -Dsoftware-factory.test.require-secure-storage=true clean verify
      - name: Verify LAN profile compilation and offline guards
        run: ./mvnw --batch-mode --no-transfer-progress -Dsoftware-factory.test.require-secure-storage=true -Plan-postgres-compatibility -DskipITs verify
